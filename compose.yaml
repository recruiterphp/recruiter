services:
  php:
    image: recruiterphp/recruiter-php
    build:
      context: .
      args:
        - PHP_VERSION=${PHP_VERSION}
      tags:
        - latest
    working_dir: /app
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - MONGODB_URI=mongodb://mongodb:27017/recruiter
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: recruiter_mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    # Lets `docker compose up --wait` block until mongod accepts connections.
    # Deliberately not wired into php's depends_on: `condition: service_healthy`
    # was reported to break worker spawning in the acceptance tests (8794825).
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 2s

volumes:
  mongodb_data:
